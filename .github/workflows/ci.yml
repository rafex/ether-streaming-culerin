# Wrapper de CI (regla 06): solo invoca targets del Makefile.
# build-test corre en contenedor (podman, preinstalado en ubuntu-latest).
# e2e necesita Go + FFmpeg + Node + Chromium a la vez: corre en el runner
# contra el webrelay (rama main) clonado junto a este repositorio.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # los avisos nuevos llegan aunque no haya cambios

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install, lint, build and coverage in container
        run: make ci

      - name: Build bridge image
        run: make app-image

  # Vulnerabilidades conocidas en las dependencias que el código alcanza. Aparte
  # de build-test para que una base de datos de avisos nueva no tumbe una
  # compilación que no ha cambiado; revisar su resultado en cada PR.
  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: source/backend/go/bridge/go.mod
          cache-dependency-path: source/backend/go/bridge/go.sum

      - name: govulncheck
        run: make vuln

  # Trivy sobre la imagen que se despliega: paquetes de Debian y dependencias del binario Go.
  # Aparte de build-test (una CVE nueva no debe tumbar una compilación que no cambió);
  # también corre cada lunes. Falla solo por HIGH/CRITICAL que ya tienen corrección.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build bridge image
        run: make app-image

      - name: Trivy
        run: make scan

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/checkout@v7.0.1
        with:
          repository: rafex/ether-webrelay
          path: ether-webrelay

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: source/backend/go/bridge/go.mod
          cache-dependency-path: source/backend/go/bridge/go.sum

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: FFmpeg and Chromium
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          cd ether-webrelay/source/frontend/nodejs/webrelay && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium

      - name: Webrelay E2E against this bridge
        run: make e2e
        env:
          WEBRELAY_DIR: ${{ github.workspace }}/ether-webrelay/source/frontend/nodejs/webrelay
          PW_CHANNEL: ""
