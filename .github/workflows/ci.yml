# Wrapper de CI (regla 06): solo invoca targets del Makefile.
# build-test corre en contenedor (podman, preinstalado en ubuntu-latest).
# e2e necesita Go + FFmpeg + Node + Chromium a la vez: corre en el runner
# contra el webrelay (rama main) clonado junto a este repositorio.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install, lint, build and coverage in container
        run: make ci

      - name: Build bridge image
        run: make app-image

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: rafex/ether-webrelay
          path: ether-webrelay

      - uses: actions/setup-go@v5
        with:
          go-version-file: source/backend/go/bridge/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: FFmpeg and Chromium
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          cd ether-webrelay/source/frontend/nodejs/webrelay && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium

      - name: Webrelay E2E against this bridge
        run: make e2e
        env:
          WEBRELAY_DIR: ${{ github.workspace }}/ether-webrelay/source/frontend/nodejs/webrelay
          PW_CHANNEL: ""
