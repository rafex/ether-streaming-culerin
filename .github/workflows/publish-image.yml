# Publica la imagen en GHCR para el despliegue GitOps (rafex/ether-streaming-gitops).
# Flux image automation detecta el mayor tag build-N y actualiza el HelmRelease del gitops.
# Solo se dispara con cambios que afectan a la imagen: un merge de documentación no debe reiniciar el
# despliegue (el puente guarda las salas en memoria).
name: Publish image

on:
  push:
    branches: [main]
    paths:
      - source/backend/**
      - containers/bridge/**
      - .github/workflows/publish-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rafex/ether-streaming-culerin

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: containers/bridge/Containerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:build-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
