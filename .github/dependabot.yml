# Actualizaciones de dependencias y de acciones de GitHub como PR semanales.
# Las acciones están fijadas a una versión exacta: Dependabot propone la nueva.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /source/backend/go/bridge
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      pion: {patterns: ["github.com/pion/*"]}
      golang-x: {patterns: ["golang.org/x/*"]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /containers/bridge
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /containers/ci
    schedule: {interval: weekly}
